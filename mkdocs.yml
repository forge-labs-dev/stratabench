site_name: stratabench
site_url: https://forge-labs-dev.github.io/stratabench/
site_description: Reproducible, content-addressed LLM evaluation harness built on Strata
repo_url: https://github.com/forge-labs-dev/stratabench
repo_name: forge-labs-dev/stratabench

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.sections
    - navigation.expand
    - navigation.top
    - content.code.copy
    - search.highlight
    - search.suggest
  icon:
    repo: fontawesome/brands/github

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - toc:
      permalink: true
  - attr_list
  - def_list
  - md_in_html

plugins:
  - search

nav:
  - Home: index.md
  - Methodology: methodology.md
  - Reproducing results: reproduce.md
  - Results format: results-format.md
