[project]
name = "stratabench"
version = "0.1.0"
description = "Reproducible, content-addressed LLM evaluation harness built on Strata"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.0",
    "pydantic>=2.0.0",
]

[project.urls]
Homepage = "https://github.com/forge-labs-dev/stratabench"
Source = "https://github.com/forge-labs-dev/stratabench"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/stratabench"]
